/* ============ MOTOR DE PRÁCTICA ============ */
function runPractice(id){
  const p=PRACTICAS[id]; const ctx={};
  let i=0;
  CURRENT=["intro",id];
  holdScreen(true);
  const next=()=>{ clearLoop(); document.body.classList.remove("dimmed"); i++; if(i<p.steps.length) step(); };
  function shell(inner){
    app.innerHTML = `
      <div class="stage">
        <div class="top">
          <button class="link" id="quit">✕ salir</button>
          <div class="progress">${p.steps.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
        </div>
        <div class="mono" style="color:var(--muted)">${pad(id)} · ${p.titulo}</div>
        ${inner}
      </div>`;
    document.getElementById("quit").onclick=exit;
  }
  function exit(){ clearLoop(); document.body.classList.remove("dimmed"); holdScreen(false); go("intro",id); }
  function countdown(secs, onEnd){
    const bar=document.getElementById("bar"), tm=document.getElementById("tm");
    const t0=performance.now(); let alive=true;
    (function f(now){
      if(!alive) return;
      requestAnimationFrame(f);
      const el=(now-t0)/1000;
      bar.style.width=Math.min(100,el/secs*100)+"%";
      tm.textContent=pad(Math.max(0,Math.ceil(secs-el)))+" s";
      if(el>=secs){ alive=false; onEnd(); }
    })(t0);
    stopLoop=()=>{alive=false};
  }
  function step(){
    const s=p.steps[i];
    if(s.type==="say"){
      shell(`<p class="voice">${s.text}</p>${s.note?`<p class="note">${s.note}</p>`:""}
        <div class="actions"><button class="btn" id="n">continuar</button></div>`);
      document.getElementById("n").onclick=next;
    }
    else if(s.type==="breath"){
      shell(`<p class="voice">${s.text}</p><div class="viz"><canvas id="v"></canvas></div><div class="timer" id="ph">&nbsp;</div>
        <div class="actions"><button class="link" id="skip">saltar →</button></div>`);
      document.getElementById("skip").onclick=next;
      breathViz(document.getElementById("v"), document.getElementById("ph"), s.cycles, ()=>{chime(); next();});
    }
    else if(s.type==="look"){
      if(s.dark) document.body.classList.add("dimmed");
      shell(`<div class="look"><p class="cmd">${s.cmd}</p>${s.sub?`<p class="sub">${s.sub}</p>`:""}</div>
        <div class="bar"><span id="bar"></span></div><div class="timer" id="tm"></div>
        <div class="actions"><button class="link" id="skip">pasar →</button></div>`);
      document.getElementById("skip").onclick=next;
      countdown(s.secs, ()=>{ chime(true); next(); });
    }
    else if(s.type==="timer"){
      shell(`<p class="voice">${s.text}</p><div class="viz"><canvas id="v"></canvas></div>
        <div class="bar"><span id="bar"></span></div><div class="timer" id="tm"></div>
        <div class="actions"><button class="link" id="skip">pasar →</button></div>`);
      document.getElementById("skip").onclick=next;
      landscapeViz(document.getElementById("v"), ctx);
      const stopViz=stopLoop;
      countdown(s.secs, ()=>{ stopViz(); chime(true); next(); });
      const stopCd=stopLoop; stopLoop=()=>{stopViz(); stopCd();};
    }
    else if(s.type==="input"){
      shell(`<p class="voice">${s.text}</p>
        <label class="f"><span>${s.label}</span><input type="text" id="in-${s.key}" maxlength="80" placeholder="${s.ph||""}" value="${esc(ctx[s.key]||"")}"></label>
        <div class="actions"><button class="btn" id="n" disabled>continuar</button></div>`);
      const inp=document.getElementById("in-"+s.key), b=document.getElementById("n");
      const upd=()=>{b.disabled=!inp.value.trim()}; inp.oninput=upd; upd(); inp.focus();
      inp.onkeydown=e=>{if(e.key==="Enter"&&!b.disabled) b.click()};
      b.onclick=()=>{ctx[s.key]=inp.value.trim(); next();};
    }
    else if(s.type==="cols"){
      shell(`${ctx.exp?`<p class="voice"><em>${esc(ctx.exp)}</em></p>`:""}
        <div class="cols">
          <label class="f"><span>${s.a.label}</span><textarea id="ca" rows="4"></textarea></label>
          <label class="f"><span>${s.b.label}</span><textarea id="cb" rows="4"></textarea></label>
        </div>
        <div class="actions"><button class="btn" id="n" disabled>continuar</button></div>`);
      const a=document.getElementById("ca"), b2=document.getElementById("cb"), b=document.getElementById("n");
      const upd=()=>{b.disabled=!b2.value.trim()}; a.oninput=upd; b2.oninput=upd;
      b.onclick=()=>{ctx[s.a.key]=a.value.trim(); ctx[s.b.key]=b2.value.trim(); next();};
    }
    else if(s.type==="range"){
      shell(`<p class="voice">${s.text}</p>
        <div class="range"><input type="range" id="rg" min="0" max="100" value="50" aria-label="${s.text}">
          <div class="ends"><span>${s.left}</span><span>${s.right}</span></div></div>
        <div class="actions"><button class="btn" id="n">continuar</button></div>`);
      document.getElementById("n").onclick=()=>{ctx[s.key]=+document.getElementById("rg").value; next();};
    }
    else if(s.type==="count"){
      shell(`<p class="voice">${s.text}</p>${s.note?`<p class="note">${s.note}</p>`:""}
        <div class="count" id="ct">${Array.from({length:s.n},()=>`<i></i>`).join("")}</div>
        <div class="actions"><button class="btn" id="one">una más</button></div>`);
      let k=0; const dots=[...document.querySelectorAll("#ct i")], b=document.getElementById("one");
      b.onclick=()=>{ dots[k].classList.add("lit"); k++; if(k>=s.n){ b.disabled=true; setTimeout(next,1100);} };
    }
    else if(s.type==="huella"){
      const pre = s.prefill ? (ctx[s.prefill]||"").split("\n")[0].slice(0,120) : "";
      shell(`<p class="voice">${p.huellaPrompt}</p>
        <label class="f"><span>tu huella · ${s.kind}</span><input type="text" id="hu" maxlength="120" value="${esc(pre)}"></label>
        <div class="actions"><button class="btn" id="n" disabled>dejar huella</button></div>`);
      const inp=document.getElementById("hu"), b=document.getElementById("n");
      const upd=()=>{b.disabled=!inp.value.trim()}; inp.oninput=upd; upd(); inp.focus();
      inp.onkeydown=e=>{if(e.key==="Enter"&&!b.disabled) b.click()};
      b.onclick=()=>{
        DB.huellas[id]={texto:inp.value.trim(), fecha:new Date().toISOString(), extra:ctx};
        saveHuella(id); chime(); holdScreen(false);
        const sig = POR_SALA[salaDe(id)].find(x=>x>id && !lit(x));
        const cierre = sig && !practicaAbierta(sig) ? `La práctica ${pad(sig)} se abre con la cápsula ${sig}, el ${fmt(fechaDia(diaDe(sig)))}.` : "";
        app.innerHTML=`<div class="stage" style="justify-content:center;align-items:center;gap:26px;text-align:center">
          <div class="ignite">✦</div>
          <p class="voice" style="margin:0 auto">Se encendió la estrella ${pad(id)}.</p>
          <p class="mono" style="color:var(--lav)">“${esc(DB.huellas[id].texto)}”</p>
          ${cierre?`<p class="note">${cierre}</p>`:""}
          <button class="btn" id="n">ver tu constelación</button></div>`;
        document.getElementById("n").onclick=()=>go("sala",salaDe(id));
      };
    }
  }
  step();
}

/* respiración 4-2-6-2 (ritmo del ritual) */
const PH=[["inhala",4],["sostén",2],["exhala",6],["pausa",2]];
function breathViz(cv, label, cycles, done){
  const c=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  const css=getComputedStyle(document.documentElement), teal=css.getPropertyValue("--teal").trim(), lav=css.getPropertyValue("--lav").trim();
  const T=14, t0=performance.now(); let alive=true;
  function f(now){
    if(!alive) return;
    requestAnimationFrame(f);
    const el=(now-t0)/1000;
    if(el>=T*cycles){ alive=false; done(); return; }
    const tc=el%T; let acc=0, ph=0;
    for(;ph<4;ph++){ if(tc<acc+PH[ph][1]) break; acc+=PH[ph][1]; }
    const u=(tc-acc)/PH[ph][1], e=x=>.5-.5*Math.cos(Math.PI*x);
    const s = ph===0?e(u):ph===1?1:ph===2?1-e(u):0;
    label.textContent=PH[ph][0].toUpperCase()+" · "+(PH[ph][1]-Math.floor(tc-acc));
    const W=cv.width,H=cv.height, R=Math.max(1,Math.min(W,H)*(.18+.2*s));
    c.clearRect(0,0,W,H);
    c.strokeStyle=lav; c.globalAlpha=.25; c.lineWidth=1*dpr; c.beginPath(); c.arc(W/2,H/2,Math.min(W,H)*.38,0,7); c.stroke();
    const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,R);
    g.addColorStop(0,teal); g.addColorStop(1,"rgba(0,0,0,0)");
    c.globalAlpha=.35+.25*s; c.fillStyle=g; c.beginPath(); c.arc(W/2,H/2,R,0,7); c.fill();
    c.globalAlpha=.9; c.strokeStyle=teal; c.lineWidth=1.5*dpr; c.beginPath(); c.arc(W/2,H/2,R,0,7); c.stroke();
    c.globalAlpha=1;
  }
  requestAnimationFrame(f);
  stopLoop=()=>{alive=false};
}

/* la línea que se vuelve paisaje (práctica 5: aquí sí se mira la pantalla) */
function landscapeViz(cv, ctx){
  const c=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  const css=getComputedStyle(document.documentElement), teal=css.getPropertyValue("--teal").trim(), lav=css.getPropertyValue("--lav").trim(), dim=css.getPropertyValue("--dim").trim();
  const t0=performance.now(); let alive=true;
  function f(now){
    if(!alive) return;
    requestAnimationFrame(f);
    const el=(now-t0)/1000, m=Math.min(1,el/8), e=.5-.5*Math.cos(Math.PI*m);
    const W=cv.width,H=cv.height, y0=H*.62; c.clearRect(0,0,W,H);
    const hY=x=> y0 - e*(H*.16*Math.sin(x/W*Math.PI*2.2+.6)+H*.07*Math.sin(x/W*Math.PI*6.1))*(.4+.6*Math.sin(x/W*Math.PI));
    [[.65,dim],[1,lav]].forEach(([sc,col],li)=>{
      c.strokeStyle=col; c.globalAlpha=li?.8:.4; c.lineWidth=(li?1.4:1)*dpr; c.beginPath();
      for(let x=0;x<=W;x+=4){ const yy=y0+(hY(x)-y0)*sc-(li?0:H*.08*e); x?c.lineTo(x,yy):c.moveTo(x,yy); }
      c.stroke();
    });
    c.globalAlpha=1;
    [["pasado",.18],["ahora",.5],["futuro",.82]].forEach(([k,fx],i)=>{
      const x=W*fx, y=hY(x);
      const pulse=Math.max(1,(10+3*Math.sin(el*1.6+i))*dpr*(.4+.6*e));
      const g=c.createRadialGradient(x,y,0,x,y,pulse*3);
      g.addColorStop(0,teal); g.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=g; c.globalAlpha=.7; c.beginPath(); c.arc(x,y,pulse*3,0,7); c.fill();
      c.globalAlpha=1; c.fillStyle=teal; c.beginPath(); c.arc(x,y,3.5*dpr,0,7); c.fill();
      c.fillStyle=lav; c.font=`italic ${13*dpr}px Spectral,Georgia,serif`; c.textAlign="center";
      const txt=(ctx[k]||k), short=txt.length>22?txt.slice(0,21)+"…":txt;
      c.globalAlpha=.4+.6*e; c.fillText(short,x,y-pulse*3-6*dpr); c.globalAlpha=1;
    });
  }
  requestAnimationFrame(f);
  stopLoop=()=>{alive=false};
}

/* ============ MIS HUELLAS ============ */
function viewBackup(){
  const ids=Object.keys(DB.huellas).map(Number).sort((x,y)=>x-y);
  app.innerHTML = header() + `
    <button class="link" id="back">← salas</button>
    <h1><small>${ids.length} de 20</small>Mis huellas</h1>
    <p class="voice">${IN_TG?"Se guardan en tu cuenta de Telegram. Si abres el laboratorio desde otro dispositivo, aquí estarán.":"Vista previa: aquí se guardan solo en este navegador. Dentro de Telegram viajan con la cuenta de cada persona."}</p>
    <div class="practicas">
      ${ids.length?ids.map(i=>`<div class="pr done" style="cursor:default">
        <span class="pr-n">cápsula ${i}</span>
        <span class="pr-t">${PRACTICAS[i]?.titulo||""}<span class="pr-h">“${esc(DB.huellas[i].texto)}”</span></span>
        <span class="pr-s">${fmt(new Date(DB.huellas[i].fecha))}</span></div>`).join(""):`<p class="note">Todavía no hay huellas. La primera se deja al terminar la práctica de la cápsula 1.</p>`}
    </div>
    <div class="actions"><button class="link" id="wipe">borrar todas mis huellas</button><span class="mono" id="wok" style="color:var(--lav)"></span></div>`;
  bindHeader();
  document.getElementById("back").onclick=()=>go("home");
  let armed=false;
  document.getElementById("wipe").onclick=e=>{
    if(!armed){ armed=true; e.target.textContent="toca de nuevo para borrarlas para siempre"; return; }
    wipeAll(); go("backup");
  };
}

/* ============ NAVEGACIÓN ============ */
function esc(s){ return String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function go(v,arg){
  clearLoop(); document.body.classList.remove("dimmed"); holdScreen(false); scrollTo(0,0);
  if(!SOUND_OK){ viewSound(()=>go(v,arg)); return; }
  CURRENT=[v,arg];
  if(v==="home") viewHome();
  else if(v==="sala") viewSala(arg);
  else if(v==="intro") viewIntro(arg);
  else if(v==="backup") viewBackup();
}
if(!IN_TG && !PREVIEW){ viewSoloTelegram(); }
else { app.innerHTML=`<p class="mono" style="color:var(--muted);margin-top:40vh;text-align:center">abriendo tu cielo…</p>`; loadAll().then(()=>go("home")); }
