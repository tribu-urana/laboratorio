<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>Laboratorio · Salas de práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;500;700&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* layout: una columna estrecha sobre un cielo; cuando la práctica pide mirar afuera, la pantalla queda solo con palabras */
:root{
  --bg:#06080c; --surface:#0d1118; --line:#1d2531;
  --fg:#dde5e8; --muted:#7b8894; --dim:#4a5560;
  --teal:#5cd6c6; --lav:#b5a5f0;
  --mono:"Victor Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --voice:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--voice);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 3s}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:26px;min-height:100%;box-sizing:border-box}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header .brand{color:var(--muted)}
header .brand b{color:var(--teal);font-weight:500}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);background:transparent;padding:5px 9px;border-radius:2px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--lav);color:var(--fg);outline:none}
.notice{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--lav);border-left:1px solid var(--lav);padding:4px 10px;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notice select{font-family:var(--mono);font-size:11px;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:3px 6px;border-radius:2px}
h1{font-family:var(--mono);font-weight:500;font-size:clamp(22px,6vw,30px);letter-spacing:.04em;line-height:1.15;margin:0;text-wrap:balance}
h1 small{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;font-weight:400}
.voice{font-family:var(--voice);font-weight:300;font-size:clamp(19px,4.6vw,23px);line-height:1.5;text-wrap:pretty;max-width:34ch;margin:0}
.voice em{color:var(--teal);font-style:italic}
.rule{height:1px;background:linear-gradient(90deg,var(--teal),var(--lav) 60%,transparent);opacity:.5;border:0;margin:0}

/* la regla del ritmo */
.ritmo{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;border:1px solid var(--line);padding:16px 18px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.ritmo b{font-family:var(--mono);font-weight:500;color:var(--teal);font-size:12px;letter-spacing:.1em}
.ritmo span{font-size:16px;line-height:1.45}
.ritmo .h{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--lav);margin-bottom:4px}

/* salas */
.salas{display:flex;flex-direction:column;gap:2px}
.sala{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;cursor:pointer;font:inherit;width:100%}
.sala:disabled{cursor:default}
.sala:not(:disabled):hover .s-name,.sala:focus-visible .s-name{color:var(--teal)}
.sala:focus-visible{outline:1px solid var(--lav);outline-offset:2px}
.s-num{font-family:var(--mono);font-size:28px;color:var(--dim);font-variant-numeric:tabular-nums}
.sala.open .s-num{color:var(--teal)}
.s-name{font-family:var(--voice);font-size:19px;line-height:1.25;min-width:0}
.sala:disabled .s-name{color:var(--muted)}
.s-meta{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stars{display:flex;gap:5px}
.stars i{width:7px;height:7px;border-radius:50%;border:1px solid var(--dim)}
.stars i.lit{background:var(--teal);border-color:var(--teal);box-shadow:0 0 8px var(--teal)}

/* prácticas */
.practicas{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:baseline;padding:16px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;cursor:pointer;font:inherit;width:100%}
.pr:not(:disabled):hover .pr-t,.pr:focus-visible .pr-t{color:var(--teal)}
.pr:focus-visible{outline:1px solid var(--lav);outline-offset:2px}
.pr:disabled{cursor:default}
.pr:disabled .pr-t{color:var(--dim)}
.pr-n{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums;text-transform:uppercase}
.pr-t{font-size:19px;line-height:1.3;min-width:0}
.pr-h{display:block;font-family:var(--voice);font-style:italic;font-weight:300;color:var(--lav);font-size:15px;margin-top:4px;overflow-wrap:anywhere}
.pr-s{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.pr.done .pr-s{color:var(--teal)}
.pr.today{background:color-mix(in srgb,var(--teal) 7%,transparent)}
.pr.today .pr-n,.pr.today .pr-s{color:var(--teal)}
.pr.late .pr-s{color:var(--lav)}
.dias-hotmart{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 4px;display:flex;flex-wrap:wrap;gap:6px 12px}
.dias-hotmart span:first-child{white-space:nowrap}

.constel{width:100%;max-width:100%;aspect-ratio:16/9;display:block}

/* escenario de práctica */
.stage{display:flex;flex-direction:column;gap:22px;flex:1}
.stage .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.progress{display:flex;gap:4px;flex:1;max-width:220px}
.progress i{height:2px;flex:1;background:var(--line)}
.progress i.on{background:var(--teal)}
.viz{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;max-height:50vh;margin:0 auto;display:grid;place-items:center}
.viz canvas{width:100%;height:100%;display:block}
.timer{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.bar{height:1px;background:var(--line);position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--teal);width:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:auto}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:13px 20px;border:1px solid var(--teal);background:transparent;color:var(--teal);cursor:pointer;border-radius:2px}
.btn:hover,.btn:focus-visible{background:color-mix(in srgb,var(--teal) 14%,transparent);outline:none}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.link{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:0;cursor:pointer;padding:8px 0}
.link:hover,.link:focus-visible{color:var(--fg);outline:none;text-decoration:underline}
.wrap > .link{align-self:flex-start}
.note{font-family:var(--mono);font-size:13px;letter-spacing:.03em;color:var(--lav);margin:0}

/* mirar afuera: solo palabras */
.look{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:42vh}
.look .cmd{font-family:var(--voice);font-weight:300;font-size:clamp(30px,8.5vw,46px);line-height:1.18;margin:0;text-wrap:balance}
.look .cmd em{color:var(--teal);font-style:italic}
.look .sub{font-family:var(--voice);font-style:italic;font-weight:300;color:var(--muted);font-size:19px;margin:0}

label.f{display:flex;flex-direction:column;gap:8px}
label.f > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{font-family:var(--voice);font-size:19px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 14px;width:100%;box-sizing:border-box;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--lav)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.range{display:flex;flex-direction:column;gap:10px}
.range .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--teal)}

.holdwrap{display:flex;justify-content:center;padding:18px 0}
.holdbtn{position:relative;overflow:hidden;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);background:transparent;border:1px solid var(--teal);border-radius:999px;padding:26px 34px;min-width:240px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.holdbtn span{position:relative;z-index:1}
.holdbtn i{position:absolute;inset:0;background:color-mix(in srgb,var(--teal) 22%,transparent);transform:scaleX(0);transform-origin:left}
/* mapa final */
.hz{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.hz-h{display:flex;gap:12px;align-items:baseline}
.hz-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--teal)}
.hz-k.h1{color:var(--muted)}.hz-k.h2{color:var(--lav)}
.hz-t{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.hz-q{font-style:italic;font-weight:300;color:var(--muted);margin:4px 0 0}
.hz-i{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.hz-i .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hz-i .t{font-size:18px;line-height:1.4;overflow-wrap:anywhere}
.hz-i .t small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.hz-i.semilla .t{color:var(--teal)}
.hz-i input{font-size:17px;padding:9px 11px}
.meta{border-left:1px solid var(--lav);padding:4px 0 4px 14px}
.meta span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta p{margin:4px 0 0;font-style:italic;font-size:19px;color:var(--lav)}
.mapcv{width:100%;display:block}
.acard{border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.acard .an{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--teal)}
.acard .ap{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.acard .ad{font-size:16.5px;line-height:1.55;margin:0}
.acard .ah{font-size:16.5px;line-height:1.55;margin:0;border-left:1px solid var(--teal);padding-left:12px}
.acard .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--bg);background:var(--teal);padding:3px 8px;align-self:flex-start;text-transform:uppercase}
.acard .badge.q{background:var(--lav)}
.acard ul{margin:0;padding-left:18px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--fg)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=date],input[type=time]{font-family:var(--voice);font-size:18px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 12px;width:100%;box-sizing:border-box;color-scheme:dark}
.citylist{display:flex;flex-direction:column;border:1px solid var(--line);border-top:0;max-height:240px;overflow:auto}
.citylist button{font:inherit;font-size:17px;text-align:left;background:var(--surface);color:var(--fg);border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.citylist button:hover,.citylist button:focus-visible{color:var(--teal);outline:none}
.err{font-family:var(--mono);font-size:12.5px;color:#f0a5a5;margin:0}
.cierre{text-align:center;font-style:italic;max-width:none}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font-family:var(--voice);font-size:18px;padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--lav);outline:none}
.opt[aria-pressed=true]{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.clist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-style:italic;font-weight:300;color:var(--lav)}
.count{display:flex;gap:14px;justify-content:center;padding:20px 0;flex-wrap:wrap}
.count i{width:16px;height:16px;border-radius:50%;border:1px solid var(--dim);transition:all .5s}
.count i.lit{background:var(--teal);border-color:var(--teal);box-shadow:0 0 14px var(--teal)}

/* aviso de sonido */
.sound{display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center}
.wave{display:flex;gap:6px;align-items:center;height:46px}
.wave i{width:3px;background:var(--teal);border-radius:2px;height:8px;opacity:.5}
.wave.on i{animation:w 1.1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes w{0%,100%{height:8px;opacity:.5}50%{height:42px;opacity:1}}
.steps3{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps3 li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:18px}
.steps3 li b{font-family:var(--mono);color:var(--teal);font-weight:500;font-size:13px;padding-top:4px}

.backup textarea{font-family:var(--mono);font-size:12px;height:90px}
body.dimmed #sky{opacity:.15}
body.dimmed .look .cmd{color:var(--muted)}
.ignite{font-family:var(--mono);font-size:64px;color:var(--teal);text-align:center;text-shadow:0 0 30px var(--teal);animation:ig 2.4s ease-out}
@keyframes ig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
footer{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){.ignite,.wave.on i{animation:none}#sky{transition:none}}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ============ CONFIGURACIÓN DE COHORTES ============
   Una línea por cohorte. Día 1 = fecha de inicio. */
const COHORTES = [
  { id: "dic-2026", inicio: "2026-12-09", pausas: ["2026-12-24","2026-12-25","2026-12-31","2027-01-01"] }
];
const COHORTE = COHORTES[COHORTES.length - 1];
const PREVIEW = true;   // prototipo: permite simular el día de la cohorte
let SIMDIA = 3;         // día simulado en la vista previa

const SALAS = [
  { n:1, nombre:"El universo que piensa" },
  { n:2, nombre:"El fin del patrón civilizatorio" },
  { n:3, nombre:"La anatomía de la transformación" },
  { n:4, nombre:"El ser que emerge" }
];
const POR_SALA = {1:[1,2,3,4,5],2:[6,7,8,9,10],3:[11,12,13,14,15],4:[16,17,18,19,20]};
const salaDe = id => Math.ceil(id/5);
const diaDe  = id => (salaDe(id)-1)*7 + ((id-1)%5) + 1;   // práctica 6 → día 8, etc.

/* ============ TELEGRAM ============
   Dentro de Telegram las huellas se guardan en la nube de Telegram, atadas a la cuenta de cada persona:
   aparecen en cualquier dispositivo donde abra el laboratorio. Fuera de Telegram (vista previa) se usa el navegador. */
const BOT_LINK = "https://t.me/TribuUranaLabBot";
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);
if(IN_TG){
  try{ TG.ready(); TG.expand(); }catch(e){}
  try{ TG.setHeaderColor("#06080c"); TG.setBackgroundColor("#06080c"); }catch(e){}
  try{ TG.disableVerticalSwipes && TG.disableVerticalSwipes(); }catch(e){}
}
const CS = IN_TG && TG.CloudStorage;

/* ============ ALMACENAMIENTO ============ */
const KEY = "tribu_urana_lab_v1";
let DB = {huellas:{}, mapa:{}, astro:null};
function localLoad(){ let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
  d=d||{}; return {huellas:d.huellas||{}, mapa:d.mapa||{}, astro:d.astro||null}; }
function localSave(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)) }catch(e){} }
const hkey = id => "h"+id;
function packHuella(h){
  let s=JSON.stringify(h);
  if(s.length>4000){ s=JSON.stringify({texto:h.texto,fecha:h.fecha}); }   // límite de Telegram: 4096 caracteres por dato
  return s;
}
function loadAll(){
  return new Promise(res=>{
    DB = localLoad();
    if(!CS) return res();
    const keys = Array.from({length:20},(_,k)=>hkey(k+1)).concat(["mapa","astro"]);
    try{
      CS.getItems(keys,(err,vals)=>{
        if(!err && vals){
          const nube={};
          for(const k of keys){ if(vals[k] && k[0]==="h"){ try{ nube[+k.slice(1)]=JSON.parse(vals[k]) }catch(e){} } }
          try{ if(vals.mapa) DB.mapa=JSON.parse(vals.mapa); else if(Object.keys(DB.mapa).length) CS.setItem("mapa",JSON.stringify(DB.mapa)); }catch(e){}
          try{ if(vals.astro) DB.astro=JSON.parse(vals.astro); else if(DB.astro) CS.setItem("astro",JSON.stringify(DB.astro)); }catch(e){}
          // lo que esté en el navegador y no en la nube se sube (por si se dejó una huella sin conexión)
          for(const id in DB.huellas){ if(!nube[id]){ nube[id]=DB.huellas[id]; try{ CS.setItem(hkey(id), packHuella(DB.huellas[id])) }catch(e){} } }
          DB.huellas = nube; localSave();
        }
        res();
      });
    }catch(e){ res(); }
  });
}
function saveHuella(id){
  localSave();
  if(CS){ try{ CS.setItem(hkey(id), packHuella(DB.huellas[id])) }catch(e){} }
}
function saveMapa(){ localSave(); if(CS){ try{ CS.setItem("mapa", JSON.stringify(DB.mapa)) }catch(e){} } }
function saveAstro(){ localSave(); if(CS){ try{ DB.astro ? CS.setItem("astro", JSON.stringify(DB.astro)) : CS.removeItem("astro") }catch(e){} } }
function wipeAll(){
  DB={huellas:{}, mapa:{}, astro:null}; localSave();
  try{ localStorage.removeItem("tu_nac") }catch(e){}
  if(CS){ try{ CS.removeItems(Array.from({length:20},(_,k)=>hkey(k+1)).concat(["mapa","astro"])) }catch(e){} }
}

/* ============ SONIDO ============ */
let AC = null;
let SOUND_OK = false;
try{ SOUND_OK = sessionStorage.getItem("tu_sound")==="1" }catch(e){}
function audioReady(){
  try{
    if(navigator.audioSession) navigator.audioSession.type = "playback"; // iPhone: que suene aunque esté en silencio
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
  }catch(e){}
}
function chime(strong){
  audioReady();
  try{
    const t = AC.currentTime;
    const notes = strong ? [[528,0],[792,.18],[1056,.36]] : [[528,0],[792,.12]];
    notes.forEach(([f,d])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.22,t+d+.03);
      g.gain.exponentialRampToValueAtTime(.0001,t+d+2.8);
      o.connect(g).connect(AC.destination); o.start(t+d); o.stop(t+d+2.9);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(strong?[180,90,180]:120) }catch(e){}
}
let wake=null;
async function holdScreen(on){
  try{
    if(on && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request("screen");
    if(!on && wake){ await wake.release(); wake=null; }
  }catch(e){ wake=null }
}

/* ============ FECHAS ============ */
/* Los días de laboratorio saltan las pausas de la cohorte (24, 25 y 31 dic, 1 ene). */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esPausa = d => (COHORTE.pausas||[]).includes(iso(d));
function fechaDia(n){
  const d=new Date(COHORTE.inicio+"T00:00:00"); let k=0;
  for(let i=0;i<60;i++){ if(!esPausa(d)){ k++; if(k===n) return new Date(d); } d.setDate(d.getDate()+1); }
  return d;
}
function hoyEsPausa(){ return !PREVIEW && esPausa(new Date()); }
function diaHoy(){
  if(PREVIEW) return SIMDIA;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const d=new Date(COHORTE.inicio+"T00:00:00"); if(hoy<d) return 0;
  let k=0; while(d<=hoy){ if(!esPausa(d)) k++; d.setDate(d.getDate()+1); }
  return k;
}
const fmt = d => d.toLocaleDateString("es-CL",{day:"numeric",month:"long"});
const salaAbierta = n => diaHoy() >= (n-1)*7+1;
const practicaAbierta = id => diaHoy() >= diaDe(id);
function estado(id){
  if(DB.huellas[id]) return "done";
  const d=diaHoy(), dd=diaDe(id);
  if(d<dd) return "locked";
  if(d===dd) return "today";
  return "late";
}

/* ============ CIELO DE FONDO ============ */
const sky = document.getElementById("sky"), sctx = sky.getContext("2d");
let STARS=[];
function sizeSky(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  sky.width=innerWidth*dpr; sky.height=innerHeight*dpr; sctx.setTransform(dpr,0,0,dpr,0,0);
  STARS=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*.9+.2,p:Math.random()*6}));
}
function drawSky(t){
  requestAnimationFrame(drawSky);
  sctx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of STARS){
    const a=.18+.22*(.5+.5*Math.sin(t/1600+s.p));
    sctx.fillStyle=`rgba(200,214,230,${a})`;
    sctx.beginPath(); sctx.arc(s.x,s.y,Math.max(.2,s.r),0,Math.PI*2); sctx.fill();
  }
}
addEventListener("resize",sizeSky); sizeSky(); requestAnimationFrame(drawSky);

/* constelación de la sala */
const CPOS = [[.14,.62],[.31,.30],[.52,.48],[.70,.22],[.86,.58]];
function drawConstel(cv, ids){
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  const c=cv.getContext("2d"); let alive=true;
  const css=getComputedStyle(document.documentElement);
  const teal=css.getPropertyValue("--teal").trim(), lav=css.getPropertyValue("--lav").trim(), dim=css.getPropertyValue("--dim").trim();
  function frame(t){
    if(!alive) return;
    requestAnimationFrame(frame);
    const W=cv.width,H=cv.height; c.clearRect(0,0,W,H);
    const P=CPOS.map(([x,y])=>[x*W,y*H]);
    for(let i=0;i<4;i++){
      const both=lit(ids[i])&&lit(ids[i+1]);
      c.strokeStyle=both?lav:dim; c.globalAlpha=both?.7:.35; c.lineWidth=(both?1.4:1)*dpr;
      c.setLineDash(both?[]:[3*dpr,6*dpr]);
      c.beginPath(); c.moveTo(...P[i]); c.lineTo(...P[i+1]); c.stroke();
    }
    c.setLineDash([]); c.globalAlpha=1;
    P.forEach(([x,y],i)=>{
      const on=lit(ids[i]);
      if(on){
        const R=Math.max(1,22*dpr*(1+.18*Math.sin(t/900+i)));
        const g=c.createRadialGradient(x,y,0,x,y,R);
        g.addColorStop(0,teal); g.addColorStop(1,"rgba(0,0,0,0)");
        c.fillStyle=g; c.globalAlpha=.55; c.beginPath(); c.arc(x,y,R,0,7); c.fill(); c.globalAlpha=1;
        c.fillStyle=teal; c.beginPath(); c.arc(x,y,4*dpr,0,7); c.fill();
      }else{
        c.strokeStyle=dim; c.lineWidth=1*dpr; c.beginPath(); c.arc(x,y,4*dpr,0,7); c.stroke();
      }
      c.fillStyle=on?teal:dim; c.font=`${10*dpr}px "Victor Mono",monospace`; c.textAlign="center";
      c.fillText(pad(ids[i]),x,y+20*dpr);
    });
  }
  requestAnimationFrame(frame);
  stopLoop=()=>{alive=false};
}

/* ============ MOTOR DE PRÁCTICA ============ */
function runPractice(id){
  const p=PRACTICAS[id]; const ctx={};
  let i=0;
  CURRENT=["intro",id];
  holdScreen(true);
  const next=()=>{ clearLoop(); document.body.classList.remove("dimmed"); i++;
    while(i<p.steps.length && p.steps[i].when && !p.steps[i].when(ctx)) i++;
    if(i<p.steps.length) step(); };
  function shell(inner){
    app.innerHTML = `
      <div class="stage">
        <div class="top">
          <button class="link" id="quit">✕ salir</button>
          <div class="progress">${p.steps.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
        </div>
        <div class="mono" style="color:var(--muted)">${pad(id)} · ${p.titulo}</div>
        ${inner}
      </div>`;
    document.getElementById("quit").onclick=exit;
  }
  function exit(){ clearLoop(); document.body.classList.remove("dimmed"); holdScreen(false); go("intro",id); }
  function countdown(secs, onEnd){
    const bar=document.getElementById("bar"), tm=document.getElementById("tm");
    const t0=performance.now(); let alive=true;
    (function f(now){
      if(!alive) return;
      requestAnimationFrame(f);
      const el=(now-t0)/1000;
      bar.style.width=Math.min(100,el/secs*100)+"%";
      tm.textContent=pad(Math.max(0,Math.ceil(secs-el)))+" s";
      if(el>=secs){ alive=false; onEnd(); }
    })(t0);
    stopLoop=()=>{alive=false};
  }
  function step(){
    const s=p.steps[i];
    if(s.type==="say"){
      shell(`<p class="voice">${T(s.text,ctx)}</p>${s.note?`<p class="note">${T(s.note,ctx)}</p>`:""}
        <div class="actions"><button class="btn" id="n">continuar</button></div>`);
      document.getElementById("n").onclick=next;
    }
    else if(s.type==="breath"){
      shell(`<p class="voice">${T(s.text,ctx)}</p><div class="viz"><canvas id="v"></canvas></div><div class="timer" id="ph">&nbsp;</div>
        <div class="actions"><button class="link" id="skip">saltar →</button></div>`);
      document.getElementById("skip").onclick=next;
      breathViz(document.getElementById("v"), document.getElementById("ph"), s.cycles, ()=>{chime(); next();});
    }
    else if(s.type==="look"){
      if(s.dark) document.body.classList.add("dimmed");
      shell(`<div class="look"><p class="cmd">${s.cmd}</p>${s.sub?`<p class="sub">${s.sub}</p>`:""}</div>
        <div class="bar"><span id="bar"></span></div><div class="timer" id="tm"></div>
        <div class="actions"><button class="link" id="skip">pasar →</button></div>`);
      document.getElementById("skip").onclick=next;
      countdown(s.secs, ()=>{ chime(true); next(); });
    }
    else if(s.type==="timer"){
      shell(`<p class="voice">${T(s.text,ctx)}</p><div class="viz"><canvas id="v"></canvas></div>
        <div class="bar"><span id="bar"></span></div><div class="timer" id="tm"></div>
        <div class="actions"><button class="link" id="skip">pasar →</button></div>`);
      document.getElementById("skip").onclick=next;
      ({landscape:landscapeViz, spiral:spiralViz, seed:seedViz, dissolve:dissolveViz, sky:skyViz, horizons:horizonsViz})[s.mode||"landscape"](document.getElementById("v"), ctx);
      const stopViz=stopLoop;
      countdown(s.secs, ()=>{ stopViz(); chime(true); next(); });
      const stopCd=stopLoop; stopLoop=()=>{stopViz(); stopCd();};
    }
    else if(s.type==="input"){
      const fld = s.long
        ? `<textarea id="in-${s.key}" rows="3" maxlength="200" placeholder="${s.ph||""}">${esc(ctx[s.key]||"")}</textarea>`
        : s.kind==="date" ? `<input type="date" id="in-${s.key}" value="${esc(ctx[s.key]||"")}">`
        : `<input type="text" id="in-${s.key}" maxlength="80" placeholder="${s.ph||""}" value="${esc(ctx[s.key]||"")}">`;
      shell(`<p class="voice">${T(s.text,ctx)}</p>${s.note?`<p class="note">${T(s.note,ctx)}</p>`:""}
        <label class="f"><span>${s.label}</span>${fld}</label>
        <div class="actions"><button class="btn" id="n" disabled>continuar</button></div>`);
      const inp=document.getElementById("in-"+s.key), b=document.getElementById("n");
      const upd=()=>{b.disabled=!s.optional && !inp.value.trim()}; inp.oninput=upd; inp.onchange=upd; upd(); if(s.kind!=="date") inp.focus();
      if(!s.long) inp.onkeydown=e=>{if(e.key==="Enter"&&!b.disabled) b.click()};
      b.onclick=()=>{ctx[s.key]=inp.value.trim().replace(/\s*\n+\s*/g," "); next();};
    }
    else if(s.type==="cols"){
      shell(`${s.text?`<p class="voice">${T(s.text,ctx)}</p>`:ctx.exp?`<p class="voice"><em>${esc(ctx.exp)}</em></p>`:""}
        <div class="cols">
          <label class="f"><span>${s.a.label}</span><textarea id="ca" rows="4"></textarea></label>
          <label class="f"><span>${s.b.label}</span><textarea id="cb" rows="4"></textarea></label>
        </div>
        <div class="actions"><button class="btn" id="n" disabled>continuar</button></div>`);
      const a=document.getElementById("ca"), b2=document.getElementById("cb"), b=document.getElementById("n");
      const upd=()=>{b.disabled=!b2.value.trim() || (s.req==="both" && !a.value.trim())}; a.oninput=upd; b2.oninput=upd;
      b.onclick=()=>{ctx[s.a.key]=a.value.trim(); ctx[s.b.key]=b2.value.trim(); next();};
    }
    else if(s.type==="hold"){
      const what = ctx[s.show]||"";
      shell(`<p class="voice">${T(s.text,ctx)}</p>
        ${what?`<p class="voice" id="sol" style="color:var(--lav);font-style:italic;transition:opacity .2s">${esc(what)}</p>`:""}
        <div class="holdwrap"><button class="holdbtn" id="hb"><span id="hbt">mantén presionado</span><i id="hbf"></i></button></div>
        <div class="actions"><button class="link" id="skip">pasar →</button></div>`);
      document.getElementById("skip").onclick=next;
      const hb=document.getElementById("hb"), hf=document.getElementById("hbf"), ht=document.getElementById("hbt"), sol=document.getElementById("sol");
      let t0=null, raf=null, done=false;
      const tick=now=>{ if(t0===null||done) return; const u=Math.min(1,(now-t0)/1000/s.secs);
        hf.style.transform=`scaleX(${u})`; if(sol) sol.style.opacity=String(1-u);
        if(u>=1){ done=true; ht.textContent="soltado"; chime(true); setTimeout(next,1400); return; } raf=requestAnimationFrame(tick); };
      const down=e=>{ e.preventDefault(); if(done) return; t0=performance.now(); ht.textContent="exhala…"; raf=requestAnimationFrame(tick); };
      const up=()=>{ if(done) return; t0=null; cancelAnimationFrame(raf); hf.style.transform="scaleX(0)"; if(sol) sol.style.opacity="1"; ht.textContent="mantén presionado"; };
      hb.addEventListener("pointerdown",down); ["pointerup","pointerleave","pointercancel"].forEach(ev=>hb.addEventListener(ev,up));
      hb.oncontextmenu=e=>e.preventDefault();
      stopLoop=()=>{ done=true; cancelAnimationFrame(raf); };
    }
    else if(s.type==="exhale"){
      shell(`<p class="voice">${T(s.text,ctx)}</p><div class="viz" style="max-height:38vh"><canvas id="v"></canvas></div>
        <div class="timer" id="tm"></div><div class="bar"><span id="bar"></span></div>
        <div class="actions"><button class="link" id="skip">pasar →</button></div>`);
      document.getElementById("skip").onclick=next;
      exhaleViz(document.getElementById("v"), s.secs);
      const stopViz=stopLoop;
      countdown(s.secs, ()=>{ stopViz(); chime(); next(); });
      const stopCd=stopLoop; stopLoop=()=>{stopViz(); stopCd();};
    }
    else if(s.type==="choose"){
      shell(`<p class="voice">${T(s.text,ctx)}</p>${s.note?`<p class="note">${T(s.note,ctx)}</p>`:""}
        <div class="opts" role="group">${s.opts.map(o=>`<button class="opt" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("")}
          ${s.otro?`<button class="opt" data-o="__otro" aria-pressed="false">otro</button>`:""}</div>
        ${s.otro?`<label class="f" id="otrof" hidden><span>cuál</span><input type="text" id="otro" maxlength="40"></label>`:""}
        <div class="actions"><button class="btn" id="n" disabled>continuar</button></div>`);
      const bs=[...document.querySelectorAll(".opt")], b=document.getElementById("n"), of=document.getElementById("otrof"), oi=document.getElementById("otro");
      const sel=()=>bs.filter(x=>x.getAttribute("aria-pressed")==="true").map(x=>x.dataset.o);
      const upd=()=>{ const v=sel(), conOtro=v.includes("__otro"); if(of) of.hidden=!conOtro;
        b.disabled=!v.length || (conOtro && !oi.value.trim()); };
      bs.forEach(x=>x.onclick=()=>{
        const on=x.getAttribute("aria-pressed")==="true";
        if(!s.multi) bs.forEach(y=>y.setAttribute("aria-pressed","false"));
        x.setAttribute("aria-pressed", on&&s.multi?"false":"true");
        upd(); if(x.dataset.o==="__otro"&&oi&&!of.hidden) oi.focus();
      });
      if(oi) oi.oninput=upd;
      b.onclick=()=>{ const v=sel().map(o=>o==="__otro"?oi.value.trim():o);
        ctx[s.key]= v.length>1 ? v.slice(0,-1).join(", ")+" y "+v[v.length-1] : v[0]; next(); };
    }
    else if(s.type==="range"){
      shell(`<p class="voice">${T(s.text,ctx)}</p>
        <div class="range"><input type="range" id="rg" min="0" max="100" value="50" aria-label="${s.text}">
          <div class="ends"><span>${s.left}</span><span>${s.right}</span></div></div>
        <div class="actions"><button class="btn" id="n">continuar</button></div>`);
      document.getElementById("n").onclick=()=>{ctx[s.key]=+document.getElementById("rg").value; next();};
    }
    else if(s.type==="count"){
      shell(`<p class="voice">${s.text}</p>${s.note?`<p class="note">${s.note}</p>`:""}
        <div class="count" id="ct">${Array.from({length:s.n},()=>`<i></i>`).join("")}</div>
        <div class="actions"><button class="btn" id="one">una más</button></div>`);
      let k=0; const dots=[...document.querySelectorAll("#ct i")], b=document.getElementById("one");
      b.onclick=()=>{ dots[k].classList.add("lit"); k++; if(k>=s.n){ b.disabled=true; setTimeout(next,1100);} };
    }
    else if(s.type==="huella"){
      const MX = s.max||120;
      const pre = s.prefill ? String(typeof s.prefill==="function" ? s.prefill(ctx) : (ctx[s.prefill]||"")).split("\n")[0].slice(0,MX) : "";
      shell(`<p class="voice">${p.huellaPrompt}</p>
        <label class="f"><span>tu huella · ${s.kind}</span><input type="text" id="hu" maxlength="${MX}" value="${esc(pre)}"></label>
        <div class="actions"><button class="btn" id="n" disabled>dejar huella</button></div>`);
      const inp=document.getElementById("hu"), b=document.getElementById("n");
      const upd=()=>{b.disabled=!inp.value.trim()}; inp.oninput=upd; upd(); inp.focus();
      inp.onkeydown=e=>{if(e.key==="Enter"&&!b.disabled) b.click()};
      b.onclick=()=>{
        if(id===9){ const prev=(DB.huellas[9]?.extra?.lista)||[]; ctx.lista=[...prev, inp.value.trim()].slice(-12); }
        DB.huellas[id]={texto:(id===9&&DB.huellas[9]?.texto)||inp.value.trim(), fecha:DB.huellas[id]?.fecha||new Date().toISOString(), extra:ctx};
        saveHuella(id); chime(); holdScreen(false);
        const sig = POR_SALA[salaDe(id)].find(x=>x>id && !lit(x));
        const cierre = sig && !practicaAbierta(sig) ? `La práctica ${pad(sig)} se abre con la cápsula ${sig}, el ${fmt(fechaDia(diaDe(sig)))}.` : "";
        app.innerHTML=`<div class="stage" style="justify-content:center;align-items:center;gap:26px;text-align:center">
          <div class="ignite">✦</div>
          <p class="voice" style="margin:0 auto">Se encendió la estrella ${pad(id)}.</p>
          <p class="mono" style="color:var(--lav)">“${esc(DB.huellas[id].texto)}”</p>
          ${cierre?`<p class="note">${cierre}</p>`:""}
          <button class="btn" id="n">ver tu constelación</button></div>`;
        document.getElementById("n").onclick=()=>go("sala",salaDe(id));

  }

}

/* respiración 4-2-6-2 (ritmo del ritual) */
const PH=[["inhala",4],["sostén",2],["exhala",6],["pausa",2]];
function breathViz(cv, label, cycles, done){
  const c=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  const css=getComputedStyle(document.documentElement), teal=css.getPropertyValue("--teal").trim(), lav=css.getPropertyValue("--lav").trim();
  const T=14, t0=performance.now(); let alive=true;
  function f(now){
    if(!alive) return;
    requestAnimationFrame(f);
    const el=(now-t0)/1000;
    if(el>=T*cycles){ alive=false; done(); return; }
    const tc=el%T; let acc=0, ph=0;
    for(;ph<4;ph++){ if(tc<acc+PH[ph][1]) break; acc+=PH[ph][1]; }
    const u=(tc-acc)/PH[ph][1], e=x=>.5-.5*Math.cos(Math.PI*x);
    const s = ph===0?e(u):ph===1?1:ph===2?1-e(u):0;
    label.textContent=PH[ph][0].toUpperCase()+" · "+(PH[ph][1]-Math.floor(tc-acc));
    const W=cv.width,H=cv.height, R=Math.max(1,Math.min(W,H)*(.18+.2*s));
    c.clearRect(0,0,W,H);
    c.strokeStyle=lav; c.globalAlpha=.25; c.lineWidth=1*dpr; c.beginPath(); c.arc(W/2,H/2,Math.min(W,H)*.38,0,7); c.stroke();
    const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,R);
    g.addColorStop(0,teal); g.addColorStop(1,"rgba(0,0,0,0)");
    c.globalAlpha=.35+.25*s; c.fillStyle=g; c.beginPath(); c.arc(W/2,H/2,R,0,7); c.fill();
    c.globalAlpha=.9; c.strokeStyle=teal; c.lineWidth=1.5*dpr; c.beginPath(); c.arc(W/2,H/2,R,0,7); c.stroke();
    c.globalAlpha=1;
  }
  requestAnimationFrame(f);
  stopLoop=()=>{alive=false};
}

/* la línea que se vuelve paisaje (práctica 5: aquí sí se mira la pantalla) */
function landscapeViz(cv, ctx){
  const c=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  const css=getComputedStyle(document.documentElement), teal=css.getPropertyValue("--teal").trim(), lav=css.getPropertyValue("--lav").trim(), dim=css.getPropertyValue("--dim").trim();
  const t0=performance.now(); let alive=true;
  function f(now){
    if(!alive) return;
    requestAnimationFrame(f);
    const el=(now-t0)/1000, m=Math.min(1,el/8), e=.5-.5*Math.cos(Math.PI*m);
    const W=cv.width,H=cv.height, y0=H*.62; c.clearRect(0,0,W,H);
    const hY=x=> y0 - e*(H*.16*Math.sin(x/W*Math.PI*2.2+.6)+H*.07*Math.sin(x/W*Math.PI*6.1))*(.4+.6*Math.sin(x/W*Math.PI));
    [[.65,dim],[1,lav]].forEach(([sc,col],li)=>{
      c.strokeStyle=col; c.globalAlpha=li?.8:.4; c.lineWidth=(li?1.4:1)*dpr; c.beginPath();
      for(let x=0;x<=W;x+=4){ const yy=y0+(hY(x)-y0)*sc-(li?0:H*.08*e); x?c.lineTo(x,yy):c.moveTo(x,yy); }
      c.stroke();
    });
    c.globalAlpha=1;
    [["pasado",.18],["ahora",.5],["futuro",.82]].forEach(([k,fx],i)=>{
      const x=W*fx, y=hY(x);
      const pulse=Math.max(1,(10+3*Math.sin(el*1.6+i))*dpr*(.4+.6*e));
      const g=c.createRadialGradient(x,y,0,x,y,pulse*3);
      g.addColorStop(0,teal); g.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=g; c.globalAlpha=.7; c.beginPath(); c.arc(x,y,pulse*3,0,7); c.fill();
      c.globalAlpha=1; c.fillStyle=teal; c.beginPath(); c.arc(x,y,3.5*dpr,0,7); c.fill();
      c.fillStyle=lav; c.font=`italic ${13*dpr}px Spectral,Georgia,serif`; c.textAlign="center";
      const txt=(ctx[k]||k), short=txt.length>22?txt.slice(0,21)+"…":txt;
      c.globalAlpha=.4+.6*e; c.fillText(short,x,y-pulse*3-6*dpr); c.globalAlpha=1;
    });
  }
  requestAnimationFrame(f);
  stopLoop=()=>{alive=false};
}

/* colores comunes de las visualizaciones */
function cols(){ const css=getComputedStyle(document.documentElement);
  return {teal:css.getPropertyValue("--teal").trim(), lav:css.getPropertyValue("--lav").trim(), dim:css.getPropertyValue("--dim").trim(), muted:css.getPropertyValue("--muted").trim()}; }
function fitCanvas(cv){ const dpr=Math.min(2,devicePixelRatio||1); cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr; return dpr; }
const corto=(t,n)=>{ t=String(t||""); return t.length>n?t.slice(0,n-1)+"…":t; };

/* práctica 7: tres episodios en tres vueltas de una espiral, alineados en el mismo radio */
function spiralViz(cv, ctx){
  const c=cv.getContext("2d"), dpr=fitCanvas(cv), K=cols();
  const t0=performance.now(); let alive=true;
  const PHI=-Math.PI/2, TH=[PHI+2*Math.PI, PHI+4*Math.PI, PHI+6*Math.PI], TMAX=PHI+6.35*Math.PI, T0=PHI+0.6*Math.PI;
  function f(now){
    if(!alive) return; requestAnimationFrame(f);
    const el=(now-t0)/1000, m=Math.min(1,el/7), e=.5-.5*Math.cos(Math.PI*m);
    const W=cv.width,H=cv.height, cx=W/2, cy=H*.54, R=Math.min(W,H)*.42, b=R/TMAX;
    const P=th=>[cx+b*th*Math.cos(th), cy+b*th*Math.sin(th)];
    c.clearRect(0,0,W,H);
    const lim=T0+(TMAX-T0)*e;
    c.strokeStyle=K.lav; c.globalAlpha=.55; c.lineWidth=1.2*dpr; c.beginPath();
    for(let th=T0; th<=lim; th+=.04){ const [x,y]=P(th); th===T0?c.moveTo(x,y):c.lineTo(x,y); } c.stroke();
    // el radio común: aparece cuando la espiral se completa
    const r2=Math.max(0,Math.min(1,(el-7)/3));
    if(r2>0){ const [x3,y3]=P(TH[2]); c.setLineDash([3*dpr,5*dpr]); c.strokeStyle=K.teal; c.globalAlpha=.6*r2;
      c.beginPath(); c.moveTo(cx,cy); c.lineTo(x3,y3-14*dpr); c.stroke(); c.setLineDash([]); }
    ["ep1","ep2","ep3"].forEach((k,i)=>{
      if(lim<TH[i]) return;
      const [x,y]=P(TH[i]), pulse=Math.max(1,(8+2.5*Math.sin(el*1.5+i))*dpr);
      const g=c.createRadialGradient(x,y,0,x,y,pulse*3); g.addColorStop(0,K.teal); g.addColorStop(1,"rgba(0,0,0,0)");
      c.globalAlpha=.7; c.fillStyle=g; c.beginPath(); c.arc(x,y,pulse*3,0,7); c.fill();
      c.globalAlpha=1; c.fillStyle=K.teal; c.beginPath(); c.arc(x,y,3.5*dpr,0,7); c.fill();
      c.fillStyle=K.lav; c.font=`italic ${12.5*dpr}px Spectral,Georgia,serif`; c.textAlign="left"; c.textBaseline="middle";
      c.fillText(corto(ctx[k],26), x+14*dpr, y);
    });
    c.globalAlpha=1;
  }
  requestAnimationFrame(f); stopLoop=()=>{alive=false};
}

/* práctica 10: el nombre guardado como semilla, con raíces que crecen */
function seedViz(cv, ctx){
  const c=cv.getContext("2d"), dpr=fitCanvas(cv), K=cols();
  const t0=performance.now(); let alive=true;
  const roots=Array.from({length:7},(_,i)=>({a:Math.PI/2+(i-3)*.32+(Math.random()-.5)*.15, w:Math.random()*2+1, l:.55+Math.random()*.45}));
  function f(now){
    if(!alive) return; requestAnimationFrame(f);
    const el=(now-t0)/1000, m=Math.min(1,el/10), e=.5-.5*Math.cos(Math.PI*m);
    const W=cv.width,H=cv.height, cx=W/2, cy=H*.42, L=Math.min(W,H)*.42;
    c.clearRect(0,0,W,H);
    c.strokeStyle=K.dim; c.globalAlpha=.5; c.lineWidth=1*dpr; c.beginPath(); c.moveTo(W*.08,cy); c.lineTo(W*.92,cy); c.stroke();
    roots.forEach((r,i)=>{
      const len=L*r.l*e; c.strokeStyle=K.lav; c.globalAlpha=.55; c.lineWidth=1*dpr; c.beginPath(); c.moveTo(cx,cy);
      for(let s=0;s<=1.0001;s+=.05){ const d=len*s, w=Math.sin(s*Math.PI*r.w+el*.4)*6*dpr*s;

    const g=c.createRadialGradient(cx,cy,0,cx,cy,pulse*4); g.addColorStop(0,K.teal); g.addColorStop(1,"rgba(0,0,0,0)");
    c.globalAlpha=.75; c.fillStyle=g; c.beginPath(); c.arc(cx,cy,pulse*4,0,7); c.fill();

    c.clearRect(0,0,W,H);

/* práctica 15: las letras se deshacen mientras respiras */
function dissolveViz(cv, ctx){
  const c=cv.getContext("2d"), dpr=fitCanvas(cv), K=cols(); const t0=performance.now(); let alive=true;
  const W=cv.width,H=cv.height, fs=Math.max(16,Math.min(26, 520/Math.max(12,(ctx.termino||"").length)*2))*dpr;
  c.font=`italic 300 ${fs}px Spectral,Georgia,serif`;
  // reparte el texto en líneas y cada letra en su lugar
  const words=String(ctx.termino||"").split(/\s+/), lines=[]; let ln="";
  for(const w of words){ const t=ln?ln+" "+w:w; if(c.measureText(t).width>W*.82&&ln){lines.push(ln); ln=w;} else ln=t; } if(ln) lines.push(ln);
  const lh=fs*1.35, y0=H/2-(lines.length-1)*lh/2, ch=[];
  lines.forEach((l,li)=>{ let x=W/2-c.measureText(l).width/2;
    for(const k of l){ const w=c.measureText(k).width; ch.push({k,x:x+w/2,y:y0+li*lh,st:3+Math.random()*16,dx:(Math.random()-.5)*60*dpr,dy:-(20+Math.random()*70)*dpr,r:(Math.random()-.5)*1.2}); x+=w; } });
  function f(now){
    if(!alive) return; requestAnimationFrame(f);
    const el=(now-t0)/1000; c.clearRect(0,0,W,H);
    const ph=(el%14), br=ph<4?ph/4:ph<6?1:ph<12?1-(ph-6)/6:0;
    const R=Math.min(W,H)*(.30+.12*br);
    c.strokeStyle=K.lav; c.globalAlpha=.18; c.lineWidth=1*dpr; c.beginPath(); c.arc(W/2,H/2,R,0,7); c.stroke();
    c.textAlign="center"; c.textBaseline="middle"; c.font=`italic 300 ${fs}px Spectral,Georgia,serif`;
    for(const p of ch){
      const u=Math.max(0,Math.min(1,(el-p.st)/5)), e=u*u;
      if(u>=1) continue;
      c.save(); c.globalAlpha=(1-e)*.95; c.fillStyle=u>0?K.lav:"#dde5e8";
      c.translate(p.x+p.dx*e, p.y+p.dy*e); c.rotate(p.r*e); c.fillText(p.k,0,0); c.restore();
    }
    c.globalAlpha=1;
  }
  requestAnimationFrame(f); stopLoop=()=>{alive=false};
}

/* práctica 18: un cielo nocturno que gira despacio */
function skyViz(cv){
  const c=cv.getContext("2d"), dpr=fitCanvas(cv), K=cols(); const t0=performance.now(); let alive=true;
  const S=Array.from({length:950},()=>{ const r=Math.sqrt(Math.random()); return {r, a:Math.random()*Math.PI*2, m:Math.pow(Math.random(),6), p:Math.random()*6}; });
  function f(now){
    if(!alive) return; requestAnimationFrame(f);
    const el=(now-t0)/1000, W=cv.width,H=cv.height, cx=W*.5, cy=H*1.05, RR=Math.hypot(W,H)*1.05, rot=el*.004;
    c.fillStyle="#04060a"; c.fillRect(0,0,W,H);
    const g=c.createLinearGradient(0,H,0,0); g.addColorStop(0,"rgba(92,214,198,.08)"); g.addColorStop(.4,"rgba(181,165,240,.04)"); g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g; c.fillRect(0,0,W,H);
    for(const s of S){
      const a=s.a+rot, x=cx+Math.cos(a)*s.r*RR, y=cy+Math.sin(a)*s.r*RR; if(x<0||x>W||y<0||y>H) continue;
      const tw=.55+.45*Math.sin(el*1.3+s.p), rad=Math.max(.3,(.5+s.m*2.4)*dpr);
      c.globalAlpha=(.25+.75*s.m)*tw; c.fillStyle=s.m>.5?K.teal:"#dfe8f0"; c.beginPath(); c.arc(x,y,rad,0,7); c.fill();
      if(s.m>.6){ c.globalAlpha=.12*tw; c.beginPath(); c.arc(x,y,rad*5,0,7); c.fill(); }
    }
    c.globalAlpha=1;
  }
  requestAnimationFrame(f); stopLoop=()=>{alive=false};
}

/* tres horizontes (práctica 20 y mapa final) */
function horizonCurves(u){ // u: 0..1 a lo largo del tiempo → altura 0..1 de cada horizonte
  const s=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a))), sm=x=>x*x*(3-2*x);
  return [ .88-.74*sm(s(u,.0,1)),                                   // H1 desciende
           .10+.62*sm(s(u,.08,.55))-.22*sm(s(u,.7,1)),              // H2 asciende en el medio
           .04+.86*sm(s(u,.25,1)) ];                                 // H3 nace al fondo
}
function drawHorizons(c, x0,y0,w,h, dpr, K, o){
  // o: {prog (0..1), labels:[t1,t2,t3], sub:[s1,s2,s3]}
  const cols3=[K.dim, K.lav, K.teal], N=120, prog=o.prog??1;
  for(let k=0;k<3;k++){
    c.strokeStyle=cols3[k]; c.lineWidth=(k===2?2.2:1.6)*dpr; c.globalAlpha=k===0?.85:1; c.beginPath();
    for(let i=0;i<=N*prog;i++){ const u=i/N, yy=y0+h-horizonCurves(u)[k]*h, xx=x0+u*w; i?c.lineTo(xx,yy):c.moveTo(xx,yy); }
    c.stroke();
  }
  c.globalAlpha=1;
  if(o.labels){
    const at=[.05,.42,.97];
    o.labels.forEach((t,k)=>{
      if(prog<at[k]) return;
      const u=at[k], yy=y0+h-horizonCurves(u)[k]*h, xx=x0+u*w;
      c.fillStyle=k===0?K.muted:cols3[k]; c.beginPath(); c.arc(xx,yy,3.5*dpr,0,7); c.fill();
      c.font=`${10*dpr}px "Victor Mono",monospace`; c.textAlign=k===2?"right":"left"; c.textBaseline="bottom";
      c.fillText(t, xx+(k===2?-8:6)*dpr, yy-8*dpr);
    });
  }
}
/* leyenda de los tres horizontes, debajo del gráfico */
function drawHorizonLegend(c, x0,y0,w, dpr, K, rows, fsz){
  const cols3=[K.muted, K.lav, K.teal]; let y=y0; fsz=fsz||13;
  rows.forEach((r,k)=>{
    c.textAlign="left"; c.textBaseline="top";
    c.font=`${10*dpr}px "Victor Mono",monospace`; c.fillStyle=cols3[k]; c.fillText(r[0], x0, y+3*dpr);
    c.font=`italic ${fsz*dpr}px Spectral,Georgia,serif`; c.fillStyle="#dde5e8";
    const lines=wrapText(c, r[1]||"", w-34*dpr);
    lines.forEach((l,i)=>c.fillText(l, x0+34*dpr, y+i*fsz*1.35*dpr));
    y+=Math.max(1,lines.length)*fsz*1.35*dpr+8*dpr;
  });
  return y;
}
function wrapText(c, t, maxW){
  const out=[]; let ln="";
  for(const w of String(t).split(/\s+/)){ if(!w) continue; const tt=ln?ln+" "+w:w; if(c.measureText(tt).width>maxW&&ln){out.push(ln); ln=w;} else ln=tt; }
  if(ln) out.push(ln); return out;
}
function horizonsViz(cv, ctx){
  const c=cv.getContext("2d"), dpr=fitCanvas(cv), K=cols(); const t0=performance.now(); let alive=true;
  function f(now){
    if(!alive) return; requestAnimationFrame(f);
    const el=(now-t0)/1000, prog=Math.min(1,el/6), W=cv.width,H=cv.height;
    c.clearRect(0,0,W,H);
    c.strokeStyle=K.dim; c.globalAlpha=.6; c.lineWidth=1*dpr; c.beginPath(); c.moveTo(W*.05,H*.60); c.lineTo(W*.95,H*.60); c.stroke(); c.globalAlpha=1;
    drawHorizons(c, W*.05,H*.08,W*.9,H*.52, dpr, K, {prog, labels:["H1","H2","H3"]});
    c.globalAlpha=Math.min(1,Math.max(0,(el-5)/1.5));
    drawHorizonLegend(c, W*.05, H*.66, W*.9, dpr, K, [["H1",ctx.h1],["H2",ctx.h2],["H3",ctx.h3]]); c.globalAlpha=1;
  }
  requestAnimationFrame(f); stopLoop=()=>{alive=false};
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[data-src="${src}"]`)) return res();
    const sc=document.createElement("script"); sc.src=src; sc.dataset.src=src; sc.onload=()=>res(); sc.onerror=()=>rej(new Error(src)); document.head.appendChild(sc);
  });
}

function calcularCielo(n){
  const X=window.LabAstro, A=X.A; const [Y,Mo,D]=n.fecha.split("-").map(Number);
  const hm=t=>{ const [h,m]=t.split(":").map(Number); return {h,m}; };
  let jd, cusps=null, c1=null, c2=null, asc=null, mc=null, tier="nose", moonRange=6.6;
  const casas=(j,c)=>A.placidus(A.norm360(A.gmst(j)+c.lon), A.obliquity(j), c.lat);
  if(n.modo==="exacta" && n.city){
    const t=hm(n.h); jd=X.localToJD(Y,Mo,D,t.h,t.m,n.city.tz,Math.round(n.city.lon/15)).jd;
    const H=casas(jd,n.city); cusps=H.cusps; asc=H.asc; mc=H.mc; tier="exacta"; moonRange=0;
  } else if(n.modo==="aproximada" && n.city){
    const t1=hm(n.h1), t2=hm(n.h2), off=Math.round(n.city.lon/15);
    const j1=X.localToJD(Y,Mo,D,t1.h,t1.m,n.city.tz,off).jd, j2=X.localToJD(Y,Mo,D,t2.h,t2.m,n.city.tz,off).jd;
    jd=(j1+j2)/2; const H=casas(jd,n.city); cusps=H.cusps; asc=H.asc;
    c1=casas(j1,n.city).cusps; c2=casas(j2,n.city).cusps; tier="rango"; moonRange=0;
  } else { jd=X.jdNoonUT(Y,Mo,D); }
  const nat=X.natalPositions(jd);
  const targets=[["Sun","tu Sol"],["Moon","tu Luna"],["Mercury","tu Mercurio"],["Venus","tu Venus"],["Mars","tu Marte"],["Jupiter","tu Júpiter"]]
    .map(([k,l])=>({key:k,label:l,lon:nat[k]}));
  if(tier==="exacta"){ targets.push({key:"Asc",label:"tu Ascendente",lon:asc}); targets.push({key:"MC",label:"tu Medio Cielo",lon:mc}); }
  const items = X.TRANSITS.map(T=>{
    let houses=null, incierta=false;
    if(cusps){
      houses=X.housesForRange(T.deg[0],T.deg[1],cusps);
      if(tier==="rango"){ const u=new Set(); [c1,cusps,c2].forEach(cc=>X.housesForRange(T.deg[0],T.deg[1],cc).forEach(h=>u.add(h)));
        const uni=[...u].sort((a,b)=>a-b); if(uni.length>houses.length){ incierta=true; houses=uni; } }
    }
    const g={};
    X.scanAspects(T.body,T.y0,T.y1,targets,2.5,moonRange).forEach(it=>{
      const id=it.tgt.key+"|"+it.asp.n;
      g[id]=g[id]||{n:it.asp.n, t:it.tgt.label, ap:!!it.approx, w:[], ex:[]};
      g[id].w.push([+it.winS.toFixed(3), +it.winE.toFixed(3)]); g[id].ex.push(+it.exact.toFixed(3));
    });
    return {key:T.key, houses, incierta, asp:Object.values(g).sort((a,b)=>a.ex[0]-b.ex[0])};
  });
  return {tier, asc: asc!==null&&tier==="exacta" ? X.fmtDeg(asc) : "", items};
}

/* ---- textos de la capa astrológica (los mismos de la calculadora) ---- */
const NOTA_TIER = {
  exacta:"Calculado con tu hora y lugar exactos: casas Placidus y aspectos a tu carta.",
  rango:"Hora aproximada: una casa se afirma si el tránsito no cambia de casa dentro de tu rango; si cambia, queda incierta. Los aspectos son a tus planetas.",
  nose:"Sin hora de nacimiento: los aspectos de los tránsitos a tus planetas. Tu Luna se toma como rango, porque se mueve rápido en el día. Las casas necesitan hora y lugar."
};
function lineaAspecto(a){
  const X=window.LabAstro, w0=Math.floor(Math.min(...a.w.map(w=>w[0]))), w1=Math.ceil(Math.max(...a.w.map(w=>w[1])));
  const ex=a.ex.map(X.decYearToLabel); const exs = ex.length>2 ? `${ex[0]} … ${ex[ex.length-1]}` : ex.join(" y ");
  return `${a.n} a ${a.t} · exacta ${exs} · ${w0>=w1?w0:`ventana ${w0}–${w1}`}${a.ap?" · aprox.":""}`;
}
function textoCasa(T, it){
  const X=window.LabAstro;
  if(!it.houses||!it.houses.length) return "";
  const main=it.houses[0], txt=sinTags(X.HT[T.key][main]||"");
  if(it.incierta) return `Casa incierta por tu hora aproximada: podría ser la ${it.houses.map(X.rom).join(" o la ")}. Te mostramos la Casa ${X.rom(main)}. ${txt}`;
  if(it.houses.length>1) return `Este tránsito atraviesa tus Casas ${it.houses.map(X.rom).join(" y ")}. ${txt}`;
  return txt;
}
function astroBloques(a){ // estructura común para pantalla y PDF
  const X=window.LabAstro; if(!a||a.tier==="nada"||!X) return null;
  return {nota:NOTA_TIER[a.tier]||"", asc:a.asc, items:a.items.map(it=>{
    const T=X.TRANSITS.find(t=>t.key===it.key);
    const badge = it.houses&&it.houses.length ? (it.incierta?`Casa ${X.rom(it.houses[0])}–${X.rom(it.houses[it.houses.length-1])} ?`:it.houses.map(h=>"Casa "+X.rom(h)).join("–")) : "";
    return {nombre:T.name, pos:T.pos, desc:sinTags(T.desc), badge, incierta:it.incierta, casa:textoCasa(T,it),
            aspectos:it.asp.slice(0,5).map(lineaAspecto)};
  })};
}
function astroHTML(a){
  const B=astroBloques(a);
  if(!B) return `<p class="note">Tu mapa se genera sin la capa astrológica.</p>`;
  return `<p class="note">${B.nota}${B.asc?` Ascendente ${esc(B.asc)}.`:""}</p>` + B.items.map(it=>`
    <div class="acard"><span class="an">${esc(it.nombre)}</span><span class="ap">${esc(it.pos)}</span>
      ${it.badge?`<span class="badge ${it.incierta?"q":""}">${esc(it.badge)}</span>`:""}
      <p class="ad">${esc(it.desc)}</p>
      ${it.casa?`<p class="ah">${esc(it.casa)}</p>`:""}
      ${it.aspectos.length?`<span class="ap">aspectos a tu carta</span><ul>${it.aspectos.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}
    </div>`).join("");
}

/* diagrama: tres horizontes sobre el tiempo real, con las ventanas de los tránsitos */
const AX0=2025, AX1=2044;
function drawMapa(cv, m, fixed){
  if(!cv) return;
  const tieneAstro = m.a && m.a.tier!=="nada" && window.LabAstro;
  let dpr, W, H, c;
  if(fixed){ c=cv.getContext("2d"); dpr=fixed.dpr; W=cv.width; H=cv.height; }
  else { cv.style.aspectRatio = tieneAstro ? (cv.clientWidth<520 ? "1/1.08" : "4/3.4") : "16/10"; dpr=fitCanvas(cv); W=cv.width; H=cv.height; c=cv.getContext("2d"); c.clearRect(0,0,W,H); }
  const K=fixed?fixed.K:cols();
  const x0=W*.03+14*dpr, w=W*.94-28*dpr, chartH = tieneAstro ? H*.46 : H*.78, y0=H*.06;
  const X = y => x0 + (y-AX0)/(AX1-AX0)*w;
  // eje
  const ay=y0+chartH+6*dpr;
  c.strokeStyle=K.dim; c.lineWidth=1*dpr; c.beginPath(); c.moveTo(x0,ay); c.lineTo(x0+w,ay); c.stroke();
  c.font=`${9.5*dpr}px "Victor Mono",monospace`; c.fillStyle=K.muted; c.textAlign="center"; c.textBaseline="top";
  [2025,2030,2035,2040,2044].forEach(y=>{ c.beginPath(); c.moveTo(X(y),ay); c.lineTo(X(y),ay+4*dpr); c.stroke(); c.fillText(String(y),X(y),ay+7*dpr); });
  // hoy
  const hoy = decYear(m.f?new Date(m.f):new Date()), hx=X(Math.max(AX0,Math.min(AX1,hoy)));
  c.setLineDash([2*dpr,4*dpr]); c.strokeStyle=K.lav; c.globalAlpha=.6; c.beginPath(); c.moveTo(hx,y0); c.lineTo(hx,tieneAstro?H*.97:ay); c.stroke(); c.setLineDash([]); c.globalAlpha=1;
  c.fillStyle=K.lav; c.textAlign="left"; c.textBaseline="top"; c.fillText("hoy", hx+4*dpr, y0);
  drawHorizons(c, x0, y0+14*dpr, w, chartH-14*dpr, dpr, K, {labels:["H1","H2","H3"]});
  if(!tieneAstro) return;
  // filas de tránsitos
  const L=window.LabAstro, rows=[["pl","PLUTÓN EN ACUARIO"],["ur","URANO EN GÉMINIS"],["ns","SATURNO-NEPTUNO 0° ARIES"]];
  const r0=ay+30*dpr, rh=(H*.97-r0)/3;
  rows.forEach(([key,label],k)=>{
    const T=L.TRANSITS.find(t=>t.key===key), it=m.a.items.find(i=>i.key===key); if(!T||!it) return;
    const yy=r0+k*rh+rh*.45;
    c.font=`${9*dpr}px "Victor Mono",monospace`; c.fillStyle=K.muted; c.textAlign="left"; c.textBaseline="bottom";
    c.fillText(label + (it.houses&&it.houses.length?` · CASA ${L.rom(it.houses[0])}${it.incierta?" ?":""}`:""), x0, yy-10*dpr);
    const a0=Math.max(AX0,T.y0), a1=Math.min(AX1,T.y1);
    c.strokeStyle=K.dim; c.lineWidth=2*dpr; c.globalAlpha=.8; c.beginPath(); c.moveTo(X(a0),yy); c.lineTo(X(a1),yy); c.stroke(); c.globalAlpha=1;
    const vistos=new Set(); let finAnt=-1e9;
    c.font=`${8.5*dpr}px "Victor Mono",monospace`;
    it.asp.forEach(a=>{
      a.w.forEach(([s,e])=>{ if(e<AX0||s>AX1) return; const xs=X(Math.max(AX0,s)), xe=Math.max(xs+3*dpr,X(Math.min(AX1,e)));
        c.fillStyle=key==="pl"?K.teal:key==="ur"?K.lav:"#dde5e8"; c.globalAlpha=.85; c.fillRect(xs,yy-3*dpr,xe-xs,6*dpr); c.globalAlpha=1; });
      const ex=a.ex[0], lab=a.t.replace(/^tu /,"");
      if(ex<AX0||ex>AX1||vistos.has(lab)) return;
      const xl=X(ex), tw=c.measureText(lab).width;
      if(xl-tw/2 < finAnt+6*dpr) return;               // no encimar etiquetas: el detalle está en el texto
      vistos.add(lab); finAnt=xl+tw/2;
      c.fillStyle=K.fg||"#dde5e8"; c.globalAlpha=.85; c.textAlign="center"; c.textBaseline="top"; c.fillText(lab, xl, yy+7*dpr); c.globalAlpha=1;
    });
  });
}

/* ---- descarga ---- */
async function empaquetar(m){
  const json=JSON.stringify(m);
  try{
    const cs=new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    const buf=new Uint8Array(await new Response(cs).arrayBuffer());
    let bin=""; buf.forEach(b=>bin+=String.fromCharCode(b));
    return "z"+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){ return "j"+btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
}
async function desempaquetar(s){
  const k=s[0], b=s.slice(1).replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(b+"===".slice((b.length+3)%4));
  if(k==="j") return JSON.parse(decodeURIComponent(escape(bin)));
  const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(ds).text());
}
async function descargarMapa(m, btn){
  const msg=document.getElementById("dlm");
  if(IN_TG){
    // Telegram no deja descargar archivos desde la app: el mapa se abre en el navegador, con su botón de PDF
    const url = location.origin + location.pathname + "#mapa=" + await empaquetar(m);
    try{ TG.openLink(url); }catch(e){ location.href=url; }
    if(msg){ msg.textContent="Tu mapa se abrió en el navegador. Ahí puedes descargarlo en PDF."; msg.hidden=false; }
    return;
  }
  const t=btn.textContent; btn.disabled=true; btn.textContent="preparando…";
  try{ await crearPDF(m); }
  catch(e){ if(msg){ msg.textContent="No se pudo crear el PDF. Revisa tu conexión e intenta de nuevo."; msg.hidden=false; } }
  btn.disabled=false; btn.textContent=t;
}
async function viewMapaExterno(){
  app.innerHTML = `<p class="mono" style="color:var(--muted);margin-top:40vh;text-align:center">abriendo tu mapa…</p>`;
  let m; try{ m=await desempaquetar(location.hash.slice(6)); }catch(e){ m=null; }
  if(!m){ app.innerHTML=`<p class="voice">Este enlace del mapa no se pudo leer.</p>`; return; }
  app.innerHTML = `<div class="mono brand" style="color:var(--muted)"><b style="color:var(--teal);font-weight:500">ASTROLABIO</b> · TRIBU_URANA</div><div id="mapa"></div>`;
  pintarMapa(document.getElementById("mapa"), m, {});
}

/* ---- PDF: páginas A4 dibujadas en canvas ---- */
async function crearPDF(m){
  await loadScript(JSPDF_URL);
  if(m.a && m.a.tier!=="nada") await loadAstro();
  try{ await Promise.all(['400 20px "Victor Mono"','500 20px "Victor Mono"','300 20px Spectral','italic 300 20px Spectral','400 20px Spectral'].map(f=>document.fonts.load(f))); }catch(e){}
  const pages=paginasMapa(m);
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4",compress:true});
  pages.forEach((cv,i)=>{ if(i) doc.addPage(); doc.addImage(cv.toDataURL("image/jpeg",.88),"JPEG",0,0,595.28,841.89,undefined,"FAST"); });
  const slug=(m.n||"astrolabio").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  doc.save(`mapa-${slug||"astrolabio"}.pdf`);
}
function paginasMapa(m){
  const W=1240, H=1754, dpr=2, M=56*dpr, CW=W-2*M, pages=[];
  const K={teal:"#5cd6c6", lav:"#b5a5f0", dim:"#4a5560", muted:"#7b8894", fg:"#dde5e8"};
  const fecha = m.f ? new Date(m.f) : new Date(), fstr=`${fmt(fecha)} ${fecha.getFullYear()}`;
  let c, y;
  const nueva=()=>{ const cv=document.createElement("canvas"); cv.width=W; cv.height=H; c=cv.getContext("2d");
    c.fillStyle="#06080c"; c.fillRect(0,0,W,H);
    c.font=`${8.5*dpr}px "Victor Mono",monospace`; c.fillStyle=K.dim; c.textAlign="left"; c.textBaseline="bottom";
    c.fillText(`ASTROLABIO · TRIBU URANA · MAPA DE TRES HORIZONTES · VERSIÓN 1 · ${fstr.toUpperCase()}`, M, H-28*dpr);
    c.textAlign="right"; c.fillText(String(pages.length+1), W-M, H-28*dpr);
    pages.push(cv); y=M; };
  const limite=()=>H-M-24*dpr;
  const fonts={mono:s=>`400 ${s*dpr}px "Victor Mono",monospace`, monoB:s=>`500 ${s*dpr}px "Victor Mono",monospace`,
               voz:s=>`300 ${s*dpr}px Spectral,Georgia,serif`, vozI:s=>`italic 300 ${s*dpr}px Spectral,Georgia,serif`};
  const txt=(t,o)=>{ if(!t) return; o=o||{}; const size=o.size||13, lh=(o.lh||1.5)*size*dpr, x=M+(o.ind||0)*dpr, mw=CW-(o.ind||0)*dpr;
    c.font=fonts[o.f||"voz"](size); const lines=wrapText(c, o.up?String(t).toUpperCase():t, mw);
    lines.forEach(l=>{ if(y+lh>limite()) nueva(); c.font=fonts[o.f||"voz"](size); c.fillStyle=o.color||K.fg; c.textAlign=o.center?"center":"left"; c.textBaseline="top";
      c.fillText(l, o.center?W/2:x, y); y+=lh; });
    y+=(o.gap??6)*dpr; };
  const sp=v=>{ y+=v*dpr; };
  const regla=()=>{ if(y+20*dpr>limite()) nueva(); const g=c.createLinearGradient(M,0,W-M,0); g.addColorStop(0,K.teal); g.addColorStop(.6,K.lav); g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g; c.globalAlpha=.5; c.fillRect(M,y,CW,1*dpr); c.globalAlpha=1; y+=16*dpr; };
  nueva();
  txt("ASTROLABIO · Tribu Urana · Laboratorio de Reinicio Ontológico", {f:"mono",size:9,color:K.teal,up:true,gap:2});
  txt(`Mapa de tres horizontes · versión 1 · ${fstr}`, {f:"mono",size:9,color:K.muted,up:true,gap:18});
  txt(m.n||"Tu mapa", {f:"monoB",size:30,lh:1.2,gap:12});
  if(m.d) txt(`Desde dónde actúas: ${m.d}`, {f:"vozI",size:16,color:K.lav,gap:14});
  // diagrama
  const tieneAstro = m.a && m.a.tier!=="nada" && window.LabAstro;
  const dh = Math.round(CW*(tieneAstro?0.82:0.56));
  if(y+dh>limite()) nueva();
  const dc=document.createElement("canvas"); dc.width=CW; dc.height=dh;
  drawMapa(dc, m, {dpr, K}); c.drawImage(dc, M, y); y+=dh+18*dpr;
  // horizontes
  HORIZ.forEach((Hz,k)=>{
    regla();
    txt(`${Hz.k} · ${Hz.t}`, {f:"mono",size:11,color:[K.muted,K.lav,K.teal][k],up:true,gap:8});
    Hz.grupos.forEach(g=>{
      txt(g.q, {f:"vozI",size:13,color:K.muted,gap:6});
      g.ids.forEach(i=>{
        if(y+40*dpr>limite()) nueva();
        txt(`cápsula ${i} · ${PRACTICAS[i].titulo}${i===10?" · semilla":""}`, {f:"mono",size:8.5,color:K.dim,up:true,gap:1,ind:12});
        txt(m.h[i]||"sin huella", {f:"voz",size:14,color:m.h[i]?(i===10?K.teal:K.fg):K.dim,gap:8,ind:12});
      });
    });
    if(k===0&&m.v){ txt("La metáfora que organizaba tu vida", {f:"mono",size:8.5,color:K.muted,up:true,gap:1,ind:12}); txt(m.v,{f:"vozI",size:15,color:K.lav,gap:10,ind:12}); }
    if(k===2&&m.e){ txt("La metáfora que emerge", {f:"mono",size:8.5,color:K.muted,up:true,gap:1,ind:12}); txt(m.e,{f:"vozI",size:15,color:K.lav,gap:10,ind:12}); }
    sp(6);
  });
  // capa astrológica
  const B=astroBloques(m.a);
  regla();
  txt("El tiempo colectivo sobre tu carta", {f:"mono",size:11,color:K.teal,up:true,gap:8});
  if(!B) txt("Este mapa se generó sin la capa astrológica.", {f:"vozI",size:13,color:K.muted});
  else {
    txt(B.nota+(B.asc?` Ascendente ${B.asc}.`:""), {f:"vozI",size:12.5,color:K.muted,gap:12});
    B.items.forEach(it=>{
      if(y+80*dpr>limite()) nueva();
      txt(it.nombre, {f:"monoB",size:12,color:K.teal,gap:2});
      txt(it.pos+(it.badge?`  ·  ${it.badge}`:""), {f:"mono",size:9,color:K.muted,up:true,gap:6});
      txt(it.desc, {f:"voz",size:12.5,gap:6});
      if(it.casa) txt(it.casa, {f:"voz",size:12.5,color:K.lav,gap:6,ind:12});
      if(it.aspectos.length){ txt("Aspectos a tu carta", {f:"mono",size:8.5,color:K.muted,up:true,gap:2});
        it.aspectos.forEach(l=>txt(l,{f:"mono",size:9.5,gap:1,ind:12})); }
      sp(14);
    });
  }
  regla(); sp(10);
  txt(CIERRE, {f:"vozI",size:17,color:K.lav,center:true});
  return pages;
}

    <div class="practicas">
      ${ids.length?ids.map(i=>`<div class="pr done" style="cursor:default">
        <span class="pr-n">cápsula ${i}</span>
        <span class="pr-t">${PRACTICAS[i]?.titulo||""}<span class="pr-h">“${esc(DB.huellas[i].texto)}”</span></span>
        <span class="pr-s">${fmt(new Date(DB.huellas[i].fecha))}</span></div>`).join(""):`<p class="note">Todavía no hay huellas. La primera se deja al terminar la práctica de la cápsula 1.</p>`}
    </div>
    <div class="actions"><button class="link" id="wipe">borrar todas mis huellas</button><span class="mono" id="wok" style="color:var(--lav)"></span></div>`;

/* ============ NAVEGACIÓN ============ */
function esc(s){ return String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function go(v,arg){
  clearLoop(); document.body.classList.remove("dimmed"); holdScreen(false); scrollTo(0,0);
  if(!SOUND_OK){ viewSound(()=>go(v,arg)); return; }
  CURRENT=[v,arg];
  if(v==="home") viewHome();
  else if(v==="sala") viewSala(arg);
  else if(v==="intro") viewIntro(arg);
  else if(v==="backup") viewBackup();
  else if(v==="sumar") viewSumar();
  else if(v==="mapa") viewMapa(arg);
}
if(location.hash.startsWith("#mapa=")){ viewMapaExterno(); }
else if(!IN_TG && !PREVIEW){ viewSoloTelegram(); }
else { app.innerHTML=`<p class="mono" style="color:var(--muted);margin-top:40vh;text-align:center">abriendo tu cielo…</p>`; loadAll().then(()=>go("home")); }
