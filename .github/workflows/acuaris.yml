# Mensajes diarios de Acuaris en el grupo del Laboratorio.
# Mañana: 8:00 de Chile (11:00 UTC en verano), lee mensajes.json (texto del día + botón).
# Tarde: 18:30 de Chile (21:30 UTC en verano), lee tarde.json (una o dos intervenciones para conversar).
# GitHub puede atrasar cada envío algunos minutos. Si la fecha no está en el archivo, no envía nada.
# Para pausarlo: pestaña Actions > "Mensaje diario de Acuaris" > "Disable workflow".
name: Mensaje diario de Acuaris

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha (AAAA-MM-DD). Vacío = hoy"
        required: false
        default: ""
      franja:
        description: "manana o tarde. Vacío = según la hora"
        required: false
        default: ""
      solo_ver:
        description: "si = mostrar el texto sin enviarlo"
        required: false
        default: ""

jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: "-1003964114876"
      FECHA: ${{ github.event.inputs.fecha }}
      FRANJA: ${{ github.event.inputs.franja }}
      SOLO_VER: ${{ github.event.inputs.solo_ver }}
    steps:
      - uses: actions/checkout@v4
      - name: Enviar
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          from zoneinfo import ZoneInfo
          ahora = datetime.datetime.now(ZoneInfo("America/Santiago"))
          fecha = os.environ.get("FECHA") or ahora.date().isoformat()
          franja = os.environ.get("FRANJA") or ("manana" if ahora.hour < 13 else "tarde")
          if franja == "manana":
              m = json.load(open("mensajes.json", encoding="utf-8")).get(fecha)
              envios = [m] if m and m.get("texto") else []
          else:
              envios = [{"texto": t} for t in json.load(open("tarde.json", encoding="utf-8")).get(fecha, [])]
          if not envios:
              print("Sin mensaje para", fecha, franja); raise SystemExit(0)
          for m in envios:
              data = {"chat_id": os.environ["CHAT_ID"], "text": m["texto"]}
              if m.get("boton"):
                  data["reply_markup"] = {"inline_keyboard": [[{"text": "Abrir mi práctica", "url": "https://t.me/TribuUranaLabBot"}]]}
              if os.environ.get("SOLO_VER") == "si":
                  print("— PRUEBA, no se envía —", fecha, franja); print(m["texto"]); continue
              req = urllib.request.Request(
                  "https://api.telegram.org/bot%s/sendMessage" % os.environ["TELEGRAM_TOKEN"],
                  data=json.dumps(data).encode(), headers={"Content-Type": "application/json"})
              r = json.load(urllib.request.urlopen(req))
              print("Enviado:", fecha, franja, r.get("ok"))
          PY
